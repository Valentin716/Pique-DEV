<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA - Comparativa Triple</title>
    <style>
        :root { --bfs: #3b82f6; --dfs: #10b981; --ucs: #f59e0b; --bg: #0f172a; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 1100px; margin-top: 20px; }
        
        .card { background: #1e293b; padding: 20px; border-radius: 15px; text-align: center; border-top: 5px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .card.bfs { border-color: var(--bfs); }
        .card.dfs { border-color: var(--dfs); }
        .card.ucs { border-color: var(--ucs); }

        .city-name { font-size: 1.5rem; font-weight: bold; margin: 15px 0; color: #f1f5f9; min-height: 40px; }
        .stats { font-size: 0.9rem; color: #94a3b8; }
        
        .btn { background: #6366f1; color: white; border: none; padding: 20px 50px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-bottom: 20px; width: 100%; max-width: 400px; }
        .btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>

    <h2>Comparativa de Búsquedas: Jiloyork ➔ Monterrey</h2>
    
    <button class="btn" onclick="iniciarComparativa()">CALCULAR TODAS LAS RUTAS</button>

    <div class="grid-container">
        <div class="card bfs">
            <div style="color: var(--bfs); font-weight: bold;">AMPLITUD (BFS)</div>
            <div class="city-name" id="city-bfs">---</div>
            <div class="stats">Costo: <span id="cost-bfs">0</span> km</div>
        </div>

        <div class="card dfs">
            <div style="color: var(--dfs); font-weight: bold;">PROFUNDIDAD (DFS)</div>
            <div class="city-name" id="city-dfs">---</div>
            <div class="stats">Costo: <span id="cost-dfs">0</span> km</div>
        </div>

        <div class="card ucs">
            <div style="color: var(--ucs); font-weight: bold;">COSTO UNIFORME (UCS)</div>
            <div class="city-name" id="city-ucs">---</div>
            <div class="stats">Costo: <span id="cost-ucs">0</span> km</div>
        </div>
    </div>

    <script>
        async function correrAlgoritmo(alg) {
            let finalizado = false;
            while (!finalizado) {
                const res = await fetch(`/paso_comparativo?alg=${alg}`);
                const data = await res.json();
                
                if (data.status === "buscando" || data.status === "encontrado") {
                    document.getElementById(`city-${alg}`).innerText = data.ciudad;
                    document.getElementById(`cost-${alg}`).innerText = data.costo;
                }
                
                if (data.status === "encontrado") {
                    document.getElementById(`city-${alg}`).style.color = "#22c55e";
                    finalizado = true;
                }
                if (data.status === "finalizado") finalizado = true;

                await new Promise(r => setTimeout(r, 600)); // Velocidad de la animación
            }
        }

        async function iniciarComparativa() {
            document.querySelector('.btn').disabled = true;
            await fetch('/iniciar_todas');
            
            // Ejecutamos las 3 búsquedas en paralelo
            Promise.all([
                correrAlgoritmo('bfs'),
                correrAlgoritmo('dfs'),
                correrAlgoritmo('ucs')
            ]).then(() => {
                document.querySelector('.btn').disabled = false;
            });
        }
    </script>
</body>
</html>
